<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Explorer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        select, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
        }

        #countryInfo {
            background-color: white;
            max-width: 400px;
            margin: 25px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        img {
            width: 200px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Country Explorer</h1>
    <p>Select a country to explore its information.</p>

    <select id="country">
        <option value="CAN">Canada</option>
        <option value="CHN">China</option>
        <option value="USA">United States</option>
        <option value="JPN">Japan</option>
        <option value="GBR">United Kingdom</option>
        <option value="FRA">France</option>
        <option value="DEU">Germany</option>
        <option value="AUS">Australia</option>
        <option value="KOR">South Korea</option>
        <option value="BRA">Brazil</option>
    </select>

    <button id="searchButton">Explore</button>

    <div id="countryInfo">
        <p>Choose a country to get started.</p>
    </div>

    <script>
        const countrySelect = document.getElementById("country");
        const searchButton = document.getElementById("searchButton");
        const countryInfo = document.getElementById("countryInfo");

        async function getCountry() {
            const country = countrySelect.value;

            countryInfo.textContent = "Loading...";

            try {
                const response = await fetch(
                    "https://restcountries.com/v3.1/alpha/" + country
                );

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();
                const info = data[0];

                countryInfo.innerHTML = `
                    <h2>${info.name.common}</h2>
                    <img src="${info.flags.png}" alt="Country flag">
                    <p>Capital: ${info.capital[0]}</p>
                    <p>Population: ${info.population.toLocaleString()}</p>
                    <p>Region: ${info.region}</p>
                    <p>Area: ${info.area.toLocaleString()} km²</p>
                    <p>Language: ${Object.values(info.languages).join(", ")}</p>
                `;

            } catch (error) {
                countryInfo.textContent = "Unable to load country information. Please try again.";
            }
        }

        searchButton.addEventListener("click", getCountry);
    </script>

</body>
</html>
